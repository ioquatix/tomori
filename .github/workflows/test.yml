name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting and Clippy, in a job of their own so that they don't add to the test job's time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          # Its own cache, of checked rather than built dependencies.
          cache-shared-key: lint-check
      - name: Install the ALSA development files for the desktop client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: actions/cache@v6
        with:
          path: .tools/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}
      - name: Fetch the sherpa-onnx libraries
        run: bash scripts/fetch-sherpa-onnx.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # An environment's server side uses tomori-assets without its gpu feature, so its core must build, lint cleanly and depend on no GPU crate without it. See design/assets.md.
      - name: Check tomori-assets without the GPU
        run: |
          cargo clippy --package tomori-assets --no-default-features --all-targets --locked -- -D warnings
          if cargo tree --package tomori-assets --no-default-features --edges normal --prefix none --locked | grep -E '^(wgpu|naga|ash|tomori-render) '; then
            echo "::error file=crates/assets/Cargo.toml::tomori-assets depends on a GPU crate without its gpu feature."
            exit 1
          fi

  # The workspace tests on current stable Rust. Pull requests and pushes to main run the tests under the Base 100% source-region coverage gate. The merge queue runs them without coverage instrumentation, which takes most of this job's time: each pull request in it has already passed the gate on its own, and the queue checks that it still builds and passes merged with those ahead of it. Pushes keep the gate so that main's Rust cache, which pull requests restore, holds the instrumented build. The main branch ruleset requires test-result below and check from publish.yml. See the Tests section of readme.md and design/testing.md.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
          # Invalidate caches containing the retired socketry-cargo-bake launcher.
          cache-shared-key: coverage-bake-launcher-v2
      # Mesa's software Vulkan driver, lavapipe, and the Vulkan loader, so that the offscreen rendering tests run without a GPU.
      - name: Install the ALSA development files for the desktop client, and lavapipe
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v6
        with:
          path: .tools/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}
      - name: Fetch the sherpa-onnx libraries
        run: bash scripts/fetch-sherpa-onnx.sh
      # The speech models that the speech tests run, kept between runs. The key changes with the scripts, which pin each model's digests, and the scripts check every model against them, cached or not, fetching again any that does not match.
      - uses: actions/cache@v6
        with:
          path: |
            .tools/asr
            .tools/tts/kokoro-multi-lang-v1_0
          key: speech-models-${{ hashFiles('scripts/fetch-asr-model.sh', 'scripts/fetch-tts-model.sh') }}
      - name: Fetch the speech models
        # Whisper tiny.en rather than the server's default, small.en, which is ten times larger.
        run: |
          bash scripts/fetch-asr-model.sh whisper tiny.en
          bash scripts/fetch-tts-model.sh
      # Runs the test binaries in parallel, each test in a process of its own, and records each test's time, with or without coverage. See .config/nextest.toml.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # In the merge queue: the targets and the documentation tests that the coverage task runs, without instrumentation. Nextest does not run documentation tests.
      - name: Run tests
        if: env.COVERAGE == 'false'
        env:
          # Fail the rendering tests, rather than skipping them, if no Vulkan adapter is found.
          TOMORI_REQUIRE_GPU: 1
          # Fail the speech model tests, rather than skipping them, if a model is missing.
          TOMORI_REQUIRE_MODELS: 1
        run: |
          cargo nextest run --workspace --all-targets --locked --profile ci
          cargo test --workspace --doc --locked
      # Rust's cache keeps both tools in ~/.cargo/bin, so that these reinstall nothing unless a newer version is released.
      - name: Install Bake launcher
        if: env.COVERAGE == 'true'
        run: cargo install bake --locked
      - name: Install coverage tool
        if: env.COVERAGE == 'true'
        run: cargo install cargo-llvm-cov --locked
      # The coverage task runs the tests itself, after the project's test:before task, which fetches the sherpa-onnx libraries, unchanged since the step above: the documentation tests with Cargo, then the other targets under `cargo llvm-cov nextest`.
      - name: Run tests and require complete source-region coverage
        if: env.COVERAGE == 'true'
        shell: bash
        env:
          TOMORI_REQUIRE_GPU: 1
          TOMORI_REQUIRE_MODELS: 1
          NEXTEST_PROFILE: ci
        run: cargo bake --locked test:coverage --all-targets true --nextest true 2>&1 | tee coverage.log
      # Bake reports a coverage failure as one line holding every uncovered region, often megabytes long, which the Actions log viewer doesn't show. This step extracts the counts, computes the percentage, and writes it to both the log and the job summary.
      - name: Summarize coverage
        if: always() && env.COVERAGE == 'true'
        shell: bash
        run: |
          result=$(grep -o -E 'region coverage is [0-9]+/[0-9]+ measured source regions[^;]*; [0-9]+ source regions remain uncovered|Region coverage passed: [0-9]+/[0-9]+ measured source regions covered[^)]*\)' coverage.log | head -n 1 || true)
          if [ -z "$result" ]; then
            echo "No coverage result found in coverage.log." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          counts=$(grep -o -E '[0-9]+/[0-9]+' <<< "$result" | head -n 1)
          percentage=$(awk -F / '{ if ($2 > 0) printf "%.2f", 100 * $1 / $2; else print "100.00" }' <<< "$counts")
          echo "Source-region coverage: ${percentage}% (${result})." | tee -a "$GITHUB_STEP_SUMMARY"
      # Nextest's JUnit report, under the target directory that ran the tests: each test's result and time.
      - name: Summarize the slowest tests
        if: always()
        shell: bash
        run: |
          report=$(find target -path '*/nextest/ci/junit.xml' -print -quit)
          if [ -z "$report" ]; then
            exit 0
          fi
          cp "$report" junit.xml
          python3 - junit.xml >> "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import sys, xml.etree.ElementTree as tree
          suites = tree.parse(sys.argv[1]).getroot()
          cases = [(float(case.get("time", 0)), suite.get("name"), case.get("name")) for suite in suites.iter("testsuite") for case in suite.iter("testcase")]
          cases.sort(reverse=True)
          print(f"### Slowest of {len(cases)} tests, {sum(case[0] for case in cases):.0f} s in all\n")
          print("| Time | Binary | Test |\n| ---: | --- | --- |")
          for time, binary, name in cases[:25]:
              print(f"| {time:.1f} s | `{binary}` | `{name}` |")
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('junit.xml') != ''
        with:
          name: junit
          path: junit.xml
          retention-days: 14

  # That every target builds on the minimum supported version, which is the workspace's `rust-version` in Cargo.toml. The tests run on stable above.
  minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the minimum supported Rust version
        id: version
        run: |
          rust=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ ! "$rust" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=Cargo.toml::Expected rust-version = \"X.Y\" in [workspace.package], found '$rust'."
            exit 1
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.version.outputs.rust }}
          # Its own cache, of checked rather than built dependencies.
          cache-shared-key: minimum-check
      - name: Install the ALSA development files for the desktop client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: actions/cache@v6
        with:
          path: .tools/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}
      - name: Fetch the sherpa-onnx libraries
        run: bash scripts/fetch-sherpa-onnx.sh
      - name: Check every target
        run: cargo check --workspace --all-targets --locked

  # The client core, the headset application for the Quest and the example headset's, as scripts/android.sh builds them.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The NDK, platform and build tools named in readme.md.
      ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-linux-android
      - name: Install the Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-32" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build the headset application
        # Fetches the Khronos OpenXR loader, checked against its published SHA-256, and packages it.
        run: bash scripts/android.sh build
      # A debug build is signed with the local debug key, and is debuggable, which android:apk:verify must refuse even with the debug key's certificate pinned.
      - name: Check that the debug build fails the release check
        run: |
          cargo install bake --locked
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/debug-certificate.sha256"
          if printed="$(cargo bake android:apk:verify target/debug/apk/tomori.apk --certificate "$RUNNER_TEMP/debug-certificate.sha256" 2>&1)"; then
            echo "::error::The debug build passed the release check."
            exit 1
          fi
          grep -F "is debuggable, which a release must not be" <<< "$printed" || { echo "$printed"; exit 1; }
      - name: Build the example headset's application
        # Another project's headset build, packaged with its own application ID, label, icon and assets, as crates/client-quest/context/android.md describes; and its library, which must export its own android_main, not Tomori's.
        run: bash scripts/android.sh --package tomori-example-headset build
      - name: Build the client core on its own
        # Checks the core with only its own features, as design/clients.md requires, rather than those the headset unifies with it. After scripts/android.sh, which creates the directory cargo-apk needs for SHERPA_ONNX_ARCHIVE_DIR.
        run: cargo apk -- build --package tomori-client --target aarch64-linux-android --locked
      - name: Build the scene on its own
        # The platform-neutral client, with only its own features, likewise.
        run: cargo apk -- build --package tomori-scene --target aarch64-linux-android --locked
      - name: Build the renderer on its own
        # The renderers, with only their own features, likewise, so that a host-only dependency in them is caught.
        run: cargo apk -- build --package tomori-render --target aarch64-linux-android --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tomori-apk
          path: target/debug/apk/tomori.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: tomori-example-headset-apk
          path: target/debug/apk/tomori-example-headset.apk
          if-no-files-found: error
          retention-days: 7

  # The headset application's release APK, made as release-artifacts.yml makes it for a release, by scripts/release-artifacts/build, sign and verify, but signed with a throwaway key made and pinned here as design/android-release.md's setup makes the release key: the release key is only in the android-release environment, which pull requests cannot use. The scripts install their own tools, as on the release's runners. It catches release-only failures before a release, checks that what is not a release's APK fails, and uploads nothing.
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: 0.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build the APK, unsigned
        run: |
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          mkdir "$RELEASE_ARTIFACTS"
          scripts/release-artifacts/build
          cp "$RELEASE_ARTIFACTS/tomori-$RELEASE_VERSION.apk" "$RUNNER_TEMP/unsigned.apk"
      - name: Make a throwaway release key, and pin its certificate
        run: |
          export PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          umask 077
          mkdir "$RUNNER_TEMP/throwaway"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/throwaway/release.keystore" -storetype PKCS12 -storepass:env PASSWORD \
            -alias tomori -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Tomori throwaway release key"
          keytool -list -v -keystore "$RUNNER_TEMP/throwaway/release.keystore" -alias tomori -storepass:env PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/release-certificate.sha256"
          # As the secrets hold them.
          base64 -w0 "$RUNNER_TEMP/throwaway/release.keystore" > "$RUNNER_TEMP/throwaway/ANDROID_RELEASE_KEYSTORE"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/throwaway/ANDROID_RELEASE_KEYSTORE_PASSWORD"
      # As release-artifacts.yml's sign step runs it, with the secrets as files in $RELEASE_SECRETS, removed afterwards.
      - name: Sign it
        run: |
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          export RELEASE_SECRETS="$RUNNER_TEMP/release-secrets"
          umask 077
          mkdir "$RELEASE_SECRETS"
          cp "$RUNNER_TEMP/throwaway/ANDROID_RELEASE_KEYSTORE" "$RUNNER_TEMP/throwaway/ANDROID_RELEASE_KEYSTORE_PASSWORD" "$RELEASE_SECRETS/"
          scripts/release-artifacts/sign
      - name: Remove the throwaway key
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-secrets" "$RUNNER_TEMP/throwaway"
      - name: Check it
        run: RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts" RELEASE_CERTIFICATE="$RUNNER_TEMP/release-certificate.sha256" scripts/release-artifacts/verify
      - name: Check that the unsigned APK, another certificate and another file fail the check
        run: |
          refused() {
            local expected="$1"
            shift
            if printed="$("$@" 2>&1)"; then
              echo "::error::$* passed the check."
              exit 1
            fi
            grep -F "$expected" <<< "$printed" || { echo "$printed"; exit 1; }
          }
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          refused "apksigner verify failed" cargo bake android:apk:verify "$RUNNER_TEMP/unsigned.apk" --certificate "$RUNNER_TEMP/release-certificate.sha256"
          printf '%064d\n' 0 > "$RUNNER_TEMP/other-certificate.sha256"
          refused "not by 0000" env RELEASE_CERTIFICATE="$RUNNER_TEMP/other-certificate.sha256" scripts/release-artifacts/verify
          touch "$RELEASE_ARTIFACTS/other"
          refused "must hold only tomori-$RELEASE_VERSION.apk" env RELEASE_CERTIFICATE="$RUNNER_TEMP/release-certificate.sha256" scripts/release-artifacts/verify

  # That no pull request edits releases.md: each release's notes are generated from the titles of the pull requests merged since the last, and only the release commit writes them. A push to `main` checks what it landed, so a hand edit that passed its pull request's check still fails there.
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits under review and their base.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: releases-bake-launcher-v1
      - name: Install Bake launcher
        run: cargo install bake --locked
      - name: Reject hand edits to the generated release notes
        env:
          # A pull request's checkout merges it into its base branch as that is now, the merge's first parent; the event's base SHA can be older, from when the pull request was opened, and would count the base branch's own commits since. A merge group uses its own base. A push checks against the branch's tip before it, catching an edit that passed its pull request's check, such as one with a forged `Release:` trailer on the pull request's own commits. Empty on manual runs, which check nothing.
          BAKE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
        run: cargo bake --locked releases:check "$BAKE_BASE"

  test-result:
    if: always()
    needs: [lint, test, minimum, android, android-release, releases]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job above, including the coverage gate wherever it runs.
      - name: Require successful tests and coverage
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
