[workspace]
members = ["crates/assets", "crates/world", "crates/environment", "crates/physics", "crates/environment-github", "crates/environment-github-client", "crates/environment-farmyard", "crates/environment-farmyard-client", "crates/environment-github-server", "crates/environment-sky", "crates/environment-sky-client", "crates/protocol", "crates/text", "crates/highlight", "crates/prometheus", "crates/security", "crates/backend", "crates/backend-opencode", "crates/client", "crates/client-quest", "crates/scene", "crates/render", "crates/client-desktop", "crates/client-spectator", "crates/discovery", "crates/server", "crates/server-app", "crates/speech", "examples/server", "examples/headset", "bake"]
resolver = "3"

[workspace.package]
# One version for every crate: they are released together, with one `releases.md` and one tag. `cargo bake cargo:release:*` updates it and the versions of the crates' dependencies on each other.
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/base-rs/tomori"
# The oldest Rust that builds the workspace with its locked dependencies: loqui-g2p, which phonemizes English for Kokoro, needs 1.92, and wgpu-hal depends on ordered-float 5.5, which needs 1.90. The source itself needs 1.88, for let chains and `slice::as_chunks`. CI builds and tests with this version.
rust-version = "1.92"

[workspace.metadata.bake.release]
reviewers = ["ioquatix"]

# The headset application that a release attaches to its GitHub Release, which `cargo bake android:apk:build`, `sign` and `verify` build, sign and check: its package, whose `[package.metadata.android]` names its application ID and APK; the file holding its release certificate's SHA-256 digest; and the SDK build tools they use. See design/android-release.md.
[workspace.metadata.bake.android.apk]
package = "tomori-client-quest"
certificate = "android/release-certificate.sha256"
build-tools = "35.0.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Keep sideload/debug builds fast enough to run the simulation at headset rates.
[profile.dev]
opt-level = 1

# `test:coverage --nextest true`, from base-rs/bake-test#41, until a bake-test release has it.
[patch.crates-io]
bake-test = { git = "https://github.com/base-rs/bake-test", rev = "11d60adee6f9b5959841245d21129804eceb5829" }
