[workspace]
members = ["crates/environment-sky", "crates/protocol", "crates/backend", "crates/backend-claude-code", "crates/backend-opencode", "crates/client", "crates/client-quest", "crates/discovery", "crates/server", "crates/speech", "bake"]
resolver = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Keep sideload/debug builds fast enough to run the simulation at headset rates.
[profile.dev]
opt-level = 1
