[package]
name = "backend-claude-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Claude Code agent backend for the Tomori server"
repository = "https://github.com/ioquatix/tomori"
license = "MIT"
publish = false

[dependencies]
async-channel = "2"
backend = { path = "../backend" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pollster = "0.4"

# A simulated `claude` executable that replays recorded stream-json scenarios for the tests.
[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"
test = false
doc = false
