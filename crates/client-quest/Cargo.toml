[package]
name = "tomori-client-quest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A conversational spatial workspace for people and agents, built with OpenXR and wgpu"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "openxr", "quest", "xr", "agents"]
categories = ["game-development", "rendering"]

[lib]
name = "tomori"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tomori"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# Tomori's own app: `tomori::app::builder()`, which registers Tomori's own environments from their crates, the `tomori` executable that runs it, and the `android_main` that runs it on the Quest. A headset build of another project's turns it off, with `default-features = false`, to write its own `android_main` that runs its builder, and to depend on no environment it does not register; see design/builders.md.
app = ["dep:tomori-environment-farmyard-client", "dep:tomori-environment-github-client", "dep:tomori-environment-sky-client"]

[dependencies]
anyhow = "1"
ash = "0.38"
tomori-client = { version = "0.2.0", path = "../client" }
glam = "0.30"
log = "0.4"
openxr = "0.22"
tomori-protocol = { version = "0.2.0", path = "../protocol" }
# On Android, environments' assets are read from the APK's `assets` folder, which the app adds to the shared library.
tomori-assets = { version = "0.2.0", path = "../assets", default-features = false }
tomori-render = { version = "0.2.0", path = "../render" }
tomori-scene = { version = "0.2.0", path = "../scene" }
# The farmyard, which Tomori's own app registers.
tomori-environment-farmyard-client = { version = "0.2.0", path = "../environment-farmyard-client", optional = true }
# The GitHub prototype's presentation, which Tomori's own app registers.
tomori-environment-github-client = { version = "0.2.0", path = "../environment-github-client", optional = true }
# Sky, which Tomori's own app registers.
tomori-environment-sky-client = { version = "0.2.0", path = "../environment-sky-client", optional = true }
serde = { version = "1", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
wgpu-hal = { version = "30.0.1", features = ["vulkan"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
ndk = { version = "0.9", features = ["audio", "api-level-29"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
tomori-client-desktop = { version = "0.2.0", path = "../client-desktop" }
# Without the spectator's own app, as the spectator modes draw this build's sceneries.
tomori-client-spectator = { version = "0.2.0", path = "../client-spectator", default-features = false }

# Desktop windows on macOS draw with Metal, which has no Vulkan driver of its own.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

[dev-dependencies]
pollster = "0.4"
serde_json = "1"
# The scene's test devices and TLS test server.
tomori-scene = { version = "0.2.0", path = "../scene", features = ["testing"] }
# A server on a loopback port, with a scripted backend, for the command's tests.
tomori-server = { version = "0.2.0", path = "../server", default-features = false, features = ["fake"] }
# The device for offscreen rendering tests, and a scenery that counts what it draws.
tomori-render = { version = "0.2.0", path = "../render", features = ["test-gpu"] }
# A window shown on that device, to run the builder's window modes without a display.
tomori-client-desktop = { version = "0.2.0", path = "../client-desktop", features = ["testing"] }

# The files left out of the 100% region-coverage gate: each holds only calls into a device or platform that CI cannot provide, and the logic around those calls is in covered modules. See the Tests section of readme.md.
[[package.metadata.bake.test.coverage.exclude]]
path = "src/xr.rs"
reason = "OpenXR runtime calls: the instance, session, swapchain, actions and the frame loop that drives them; needs an OpenXR runtime and a headset."

[[package.metadata.bake.test.coverage.exclude]]
path = "src/vulkan.rs"
reason = "Creates the Vulkan instance and device through OpenXR and imports the runtime's swapchain images into wgpu; needs an OpenXR runtime."

# Tomori's own APK, which `bash scripts/android.sh build` packages. `cargo-apk` reads this table only from the package it builds, so a headset build of another project's has a copy of its own, with its own application ID, label, icon and assets; see context/android.md.
[package.metadata.android]
package = "com.codeotaku.tomori"
apk_name = "tomori"
build_targets = ["aarch64-linux-android"]
runtime_libs = "../../android/libs"
# The licence notices of the controller models and the Basis Universal transcoder, which `tomori-render` compiles in.
assets = "../render/assets"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 32

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "com.oculus.feature.RENDER_MODEL"
required = false

[[package.metadata.android.uses_feature]]
name = "oculus.software.handtracking"
required = false

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR"

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR_SYSTEM"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.RENDER_MODEL"

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.HAND_TRACKING"

[[package.metadata.android.queries.provider]]
name = "org.khronos.openxr"
authorities = "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"

[[package.metadata.android.queries.intent]]
actions = ["org.khronos.openxr.OpenXRRuntimeService"]

[[package.metadata.android.queries.intent]]
actions = ["org.khronos.openxr.OpenXRApiLayerService"]

[package.metadata.android.application]
label = "Tomori"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
extract_native_libs = true
uses_cleartext_traffic = true

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "quest3|quest3s"

[package.metadata.android.application.activity]
exported = true
orientation = "landscape"
launch_mode = "singleTask"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|density"

[[package.metadata.android.application.activity.meta_data]]
name = "com.oculus.vr.focusaware"
value = "true"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "com.oculus.intent.category.VR"]
