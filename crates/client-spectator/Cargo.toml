[package]
name = "tomori-client-spectator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Tomori spectator: a read-only, participant-following view of a live space, in a window or as a PipeWire video source"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "spectator", "pipewire", "obs", "agents"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "tomori-spectator"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# Tomori's own spectator: `tomori_client_spectator::app::sceneries()`, which registers Tomori's own environments from their crates, and the `tomori-spectator` executable that draws them. `tomori-client-quest` turns it off, as its spectator modes draw the build's sceneries.
app = ["dep:tomori-environment-farmyard-client", "dep:tomori-environment-github-client", "dep:tomori-environment-sky-client"]

[dependencies]
anyhow = "1"
env_logger = "0.11"
glam = "0.30"
log = "0.4"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
tomori-client = { version = "0.2.0", path = "../client" }
tomori-client-desktop = { version = "0.2.0", path = "../client-desktop" }
tomori-protocol = { version = "0.2.0", path = "../protocol" }
tomori-render = { version = "0.2.0", path = "../render" }
tomori-scene = { version = "0.2.0", path = "../scene" }
# The farmyard, which Tomori's own app registers.
tomori-environment-farmyard-client = { version = "0.2.0", path = "../environment-farmyard-client", optional = true }
# The GitHub prototype's presentation, which Tomori's own app registers.
tomori-environment-github-client = { version = "0.2.0", path = "../environment-github-client", optional = true }
# Sky, which Tomori's own spectator registers.
tomori-environment-sky-client = { version = "0.2.0", path = "../environment-sky-client", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tomori-client-desktop = { version = "0.2.0", path = "../client-desktop", features = ["testing"] }
# The device for offscreen rendering tests.
tomori-render = { version = "0.2.0", path = "../render", features = ["test-gpu"] }
tomori-scene = { version = "0.2.0", path = "../scene", features = ["testing"] }

# The files left out of the 100% region-coverage gate: each holds only calls into a device or platform that CI cannot provide, and the logic around those calls is in covered modules. See design/testing.md.
[[package.metadata.bake.test.coverage.exclude]]
path = "src/child_process.rs"
reason = "Runs in a forked child before it executes its program, where the child's coverage counters are discarded."
