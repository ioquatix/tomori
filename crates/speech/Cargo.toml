[package]
name = "speech"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Streaming speech recognition, speakable text selection and synthesis for the Tomori server"
repository = "https://github.com/ioquatix/tomori"
license = "MIT"
publish = false

[features]
# Link sherpa-onnx and ONNX Runtime as shared libraries from `SHERPA_ONNX_LIB_DIR`, such as the CUDA build, instead of the static CPU libraries downloaded by default.
shared = ["sherpa-onnx/shared"]

[dependencies]
base-markdown = "0.1.4"
log = "0.4"
protocol = { path = "../protocol" }
# 1.13.8 rather than 2.x: 2.0 removed the espeak-ng fallback for words missing from Kokoro's lexicon and skips such words instead; see readme.md.
sherpa-onnx = { version = "=1.13.8", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
