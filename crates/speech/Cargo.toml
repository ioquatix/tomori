[package]
name = "speech"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Streaming speech recognition, speakable text selection and synthesis for the Tomori server"
repository = "https://github.com/ioquatix/tomori"
license = "MIT"
publish = false

[dependencies]
base-markdown = "0.1.1"
base64 = "0.22"
log = "0.4"
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
